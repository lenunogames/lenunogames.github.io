
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lenuno Games | Indie Game Studio</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			background: linear-gradient(145deg, #101a35, #203d68);
			color: white;
			font-family: Arial, sans-serif;
			text-align: center;
			display: flex;
			flex-direction: column;
		}
		header { padding: 70px 20px 30px; }
		h1 { font-size: 48px; margin-bottom: 10px; }
		.subtitle { color: #a7c8ee; font-size: 18px; }
		main { flex: 1; padding: 30px 20px; }
		.card {
			max-width: 550px;
			margin: auto;
			padding: 35px;
			background: rgba(255,255,255,0.08);
			border: 1px solid rgba(255,255,255,0.15);
			border-radius: 20px;
		}
		.card h2 { color: #70df92; }
		p { line-height: 1.7; }
		.status { color: #a7c8ee; }
		footer {
			padding: 30px;
			font-size: 14px;
			color: #a7c8ee;
		}
		a { color: #a7c8ee; margin: 0 10px; }
	</style>
</head>
<body>
	<header>
		<h1>Lenuno Games</h1>
		<p class="subtitle">Independent Game Development</p>
	</header>

	<main>
		<div class="card">
			<h2>Tower Balance</h2>
			<p>
				Stack blocks, challenge your skills,
				and build the highest tower!
			</p>
			<p>
				Compete with players around the world
				and climb the global leaderboard.
			</p>
			<p class="status">Coming soon to Android</p>
		</div>
	</main>

	<footer>
		<p>© 2026 Lenuno Games</p>
		<a href="/privacy.html">Privacy Policy</a>
		<a href="/impressum.html">Legal Notice</a>
	</footer>
</body>
</html>
